openapi: 3.0.3
info:
  title: Stage 2 Search Engine APIs
  version: 1.0.0
servers:
  - url: http://localhost
paths:
  /search:
    get:
      summary: Search indexed books
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: author, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Search page}
        '400': {description: Missing or malformed query}
  /books/{bookId}:
    get:
      summary: Retrieve book metadata
      parameters: [{name: bookId, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Book metadata}
        '404': {description: Book not found}
  /ingest/{bookId}:
    post:
      summary: Internal ingestion operation
      responses: {'200': {description: Book downloaded}, '500': {description: Download failure}}
  /index/update/{bookId}:
    post:
      summary: Internal indexing operation
      responses: {'200': {description: Book indexed}, '409': {description: Book not ingested}}
  /run/{bookId}:
    post:
      summary: Internal orchestration operation
      responses: {'200': {description: Ingestion and indexing completed}, '502': {description: Service unavailable}}
